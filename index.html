<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>감사 일기장</title><meta name="theme-color" content="#eb34e5"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><link rel="stylesheet" href="style.css?v=26fix2"></head><body>
<div class="app">
  <header class="hero"><img src="header.png" alt="감사 일기장"></header><div class="bgmControls"><button id="music" class="music" aria-label="배경음악 끄기" title="BGM 끄기">♪</button><input id="volume" class="volume" type="range" min="0" max="100" value="35" aria-label="BGM 음량"></div><audio id="bgmAudio" src="bgm.wav" preload="auto" autoplay loop></audio>
  <main class="columns">
    <section class="person"><div class="windowbar"><span></span><b>− □ ×</b></div><div class="profile"><img src="h-avatar.png"><strong>전혜나</strong><button class="plus" data-who="전혜나">＋</button></div><div class="entries" id="hEntries"></div></section>
    <section class="person"><div class="windowbar"><span></span><b>− □ ×</b></div><div class="profile"><img src="j-avatar.png"><strong>오지용</strong><button class="plus" data-who="오지용">＋</button></div><div class="entries" id="jEntries"></div></section>
  </main>
  <section class="fortune"><div class="fbar"><b>♡ 오늘의 포춘쿠키 ♡</b><span>− □ ×</span></div><div class="fbody"><img src="cookie.png"><button id="fortuneOpen">열어볼까요..</button></div></section>
</div>
<div class="shade hidden"></div>
<div id="write" class="dialog hidden"><div class="dbar"><span class="barTitle">♡ 감사 일기 쓰기 - <span id="who"></span> ♡</span><button class="close">×</button></div><div class="lace">♥　🎀　♥</div><div class="dbody"><input type="date" id="date"><div id="writeRows"></div><div class="actions"><button class="cancel">취소</button><button id="save">저장하기</button></div></div></div>
<div id="confirm" class="dialog mini hidden"><div class="dbar"><span class="barTitle"></span><button class="close">×</button></div><div class="dbody center">길 잃은 쪽지들이 사는 섬으로 보낼까요?<br><small>(그곳엔 친구가 아주 많아요..)</small><div class="actions"><button class="cancel">취소</button><button id="del">삭제</button></div></div></div>
<div id="savedPop" class="dialog mini hidden"><div class="dbar"><span class="barTitle">♡ 감사 일기장 ♡</span><button class="close">×</button></div><div class="dbody center"><b>오늘도 수고하셨습니다♡</b><div class="actions" style="grid-template-columns:1fr"><button class="cancel">확인</button></div></div></div>
<div id="fortunePop" class="dialog fortunePop hidden"><div class="dbar"><span class="barTitle">♡ 오늘의 포춘쿠키 ♡</span><button class="close">×</button></div><div class="dbody center"><div class="oldpaper"><span id="fortuneText">포춘을 열어 보세요.</span><img id="fortunePhoto" class="fortunePhoto hidden" alt="랜덤 사진"><br><small id="fortuneSource"></small></div><button class="cancel">닫기</button></div></div>
<script src="app.js?v=26fix2"></script></body></html>
